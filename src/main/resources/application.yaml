spring:
  application:
    name: p-14916-1
  autoconfigure:
    # default 프로필 : 임베딩은 OpenAI만 사용 (Ollama 임베딩 자동 설정 제외)
    exclude: org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${DATABASE_NAME:vectordb}
    username: ${DATABASE_USERNAME:vector}
    password: ${DATABASE_PASSWORD:vector123}
  jpa:
    hibernate:
      ddl-auto: update # 외부 DB(PostgreSQL)는 기본값이 none이라 테이블이 만들어지지 않는다
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always # SPRING_AI_CHAT_MEMORY 테이블 자동 생성 (내장 DB가 아니어도)
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: chat-memory
        initialize-schema: true # 컬렉션이 없으면 만든다
    openai:
      api-key: ${OPENAI_API_KEY:sk-dummy} # 키가 없어도 기동은 되게 기본값을 둔다 (실제 호출 시 401)
      embedding:
        model: text-embedding-3-small # 기본값(ada-002)은 차원 축소(dimensions)를 지원하지 않는다
        dimensions: 384
